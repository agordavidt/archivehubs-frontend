<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – ArchiveHubs</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <img src="/images/header.jpg" alt="ArchiveHubs" class="auth-logo" onerror="this.style.display='none'">

      <!-- ── Login panel ───────────────────────────────────── -->
      <div id="panel-login" class="auth-panel active">
        <h1 class="auth-title">Welcome to Archivehubs</h1>
        <p class="auth-subtitle">Your Global Diary</p>
        <p id="loginError" class="auth-error"></p>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
              <i class="fas fa-eye toggle" onclick="togglePassword('password', this)"></i>
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin:2px 0 18px; font-size:13px;">
            <label style="display:flex; align-items:center; gap:7px; cursor:pointer; color:var(--text-primary);">
              <input type="checkbox" id="remember" style="accent-color:var(--accent-color); width:15px; height:15px;">
              Remember me
            </label>
            <a href="/pages/reset-password.html">Forgot password?</a>
          </div>

          <button type="submit" class="auth-btn auth-btn-primary" id="loginBtn">
            <span id="loginBtnText">Sign In</span>
            <span id="loginSpinner" class="auth-spinner hidden"></span>
          </button>
        </form>

        <p class="auth-footer">
          Don’t have an account? <a href="/pages/signup.html">Create Account</a>
        </p>
      </div>

      <!-- ── Unverified panel ──────────────────────────────── -->
      <div id="panel-unverified" class="auth-panel">
        <div class="auth-state">
          <div class="auth-state-icon warn"><i class="fas fa-envelope-circle-check"></i></div>
          <h1 class="auth-title">Verify your email</h1>
          <p class="auth-subtitle">
            Your account isn’t verified yet.<br>
            We sent a verification link to<br>
            <strong id="unverifiedEmail"></strong>
          </p>
          <p class="auth-error" id="resendMsg" style="min-height:1.2rem;"></p>
          <button type="button" class="auth-btn auth-btn-gold" id="resendBtn">
            <span id="resendBtnText">Resend verification email</span>
            <span id="resendSpinner" class="auth-spinner hidden"></span>
          </button>
          <button type="button" class="auth-btn auth-btn-ghost" style="margin-top:10px;" onclick="showLogin()">
            Back to sign in
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="auth-toast"><span id="toastMsg"></span></div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
