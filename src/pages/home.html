<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | ArchiveHubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <!-- Shared chrome -->
  <div data-include="/components/navbar.html"></div>

  <main class="main-content">
    <section class="middle-section" style="grid-column: 1 / -1; max-width: 640px; margin: 0 auto; padding-top: 80px;">

      <!-- Create post bar -->
      <div class="create-post">
        <div class="post-input-container">
          <img src="/images/profile.jpg" alt="" class="user-profile-pic" data-me-avatar>
          <div class="post-input-wrapper" data-open-create-post style="cursor:pointer">
            <input type="text" placeholder="Start a post" class="post-input" readonly>
          </div>
        </div>
        <div class="post-actions">
          <button class="action-btn" data-open-create-post type="button">
            <i class="fas fa-image"></i><span>Media</span>
          </button>
          <button class="action-btn" data-open-create-story type="button">
            <i class="fas fa-plus-square"></i><span>Story</span>
          </button>
        </div>
      </div>

      <!-- Stories -->
      <div class="stories-section">
        <div class="stories-container">
          <div class="story-card create-story" data-open-create-story>
            <div class="story-content">
              <div class="create-story-top">
                <img src="/images/profile.jpg" alt="" class="story-avatar" data-me-avatar>
                <div class="create-story-plus"><i class="fas fa-plus"></i></div>
                <span class="story-username">Create Story</span>
              </div>
            </div>
          </div>
          <!-- Rendered stories go here via stories.js (later slice) -->
        </div>
      </div>

      <!-- Feed -->
      <div class="posts-section">
        <div class="feed-loading" style="text-align:center;padding:40px;">
          <div class="spinner"></div>
          <p>Loading posts…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared partials -->
  <div data-include="/components/modals/create-post.html"></div>
  <div data-include="/components/modals/create-story.html"></div>
  <div data-include="/components/modals/comment-modal.html"></div>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
